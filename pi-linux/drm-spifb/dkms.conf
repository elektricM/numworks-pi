# DKMS rebuilds the driver for every kernel the Pi installs, so a kernel
# upgrade never leaves the calculator screen without its driver.
PACKAGE_NAME="drm-spifb"
PACKAGE_VERSION="1.7"
BUILT_MODULE_NAME[0]="drm-spifb"
DEST_MODULE_LOCATION[0]="/extra"
MAKE[0]="make KDIR=${kernel_source_dir}"
CLEAN="make KDIR=${kernel_source_dir} clean"
AUTOINSTALL="yes"
